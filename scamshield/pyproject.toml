[project]
name = "scamshield"
version = "0.1.0"
description = "Set-and-forget scam protection for email, texts, and calls, built for regular people."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
scamshield = "scamshield.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
scamshield = ["static/*"]
